<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="24" height="24">
  <g stroke="white" stroke-width="6" stroke-linecap="round" fill="none">

    <!-- Main axes -->
    <line x1="100" y1="10"  x2="100" y2="190"/>
    <line x1="10"  y1="100" x2="190" y2="100"/>

    <!-- Diagonals -->
    <line x1="100" y1="100" x2="30"  y2="30"/>
    <line x1="100" y1="100" x2="170" y2="30"/>
    <line x1="100" y1="100" x2="30"  y2="170"/>
    <line x1="100" y1="100" x2="170" y2="170"/>

    <!-- Offset perpendicular branches -->
    <!-- Top vertical -->
    <line x1="100" y1="40" x2="130" y2="40"/>
    <!-- Bottom vertical -->
    <line x1="100" y1="160" x2="130" y2="160"/>

    <!-- Left horizontal -->
    <line x1="40" y1="100" x2="40" y2="130"/>
    <!-- Right horizontal -->
    <line x1="160" y1="100" x2="160" y2="130"/>

    <!-- Upper-left diagonal branch -->
    <line x1="55" y1="55" x2="55" y2="25"/>
    <!-- Upper-right diagonal branch -->
    <line x1="145" y1="55" x2="175" y2="55"/>

    <!-- Lower-left diagonal branch -->
    <line x1="55" y1="145" x2="25" y2="145"/>
    <!-- Lower-right diagonal branch -->
    <line x1="145" y1="145" x2="145" y2="175"/>

  </g>

  <!-- Terminal dots -->
  <g fill="white">
    <!-- Main ends -->
    <circle cx="100" cy="10"  r="7"/>
    <circle cx="100" cy="190" r="7"/>
    <circle cx="10"  cy="100" r="7"/>
    <circle cx="190" cy="100" r="7"/>

    <!-- Diagonal ends -->
    <circle cx="30"  cy="30"  r="7"/>
    <circle cx="170" cy="30"  r="7"/>
    <circle cx="30"  cy="170" r="7"/>
    <circle cx="170" cy="170" r="7"/>

    <!-- Branch ends -->
    <circle cx="130" cy="40"  r="6"/>
    <circle cx="130" cy="160" r="6"/>
    <circle cx="40"  cy="130" r="6"/>
    <circle cx="160" cy="130" r="6"/>

    <circle cx="55"  cy="25"  r="6"/>
    <circle cx="175" cy="55"  r="6"/>
    <circle cx="25"  cy="145" r="6"/>
    <circle cx="145" cy="175" r="6"/>
  </g>
</svg>
